# Render Blueprint for the API. Create it from the Render dashboard with
# New → Blueprint, then fill in the variables marked `sync: false`.
services:
  - type: web
    name: salary-management-api
    runtime: node
    plan: free
    # Closest Render region to the Supabase database (ap-southeast-2, Sydney):
    # every request makes one to three database round trips, so distance is latency.
    region: singapore
    buildCommand: npm ci && npm run build -w backend
    # The free plan has no pre-deploy step, so pending migrations run before the API
    # starts. They are idempotent, and the free plan runs a single instance (ADR-10).
    startCommand: npm run migration:run:prod -w backend && npm run start:prod -w backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Supabase session pooler connection string
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false # the frontend's URL, e.g. https://<project>.vercel.app
